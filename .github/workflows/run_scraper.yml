name: 🛒 BestPrice — 12hr Auto Price Updater

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:

      # Step 1 — Code checkout
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2 — Python setup
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3 — Chrome install (GPG error fixed)
      - name: 🌐 Install Google Chrome
        run: |
          sudo apt-get update -qq
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          echo "✅ Chrome version: $(google-chrome --version)"

      # Step 4 — ChromeDriver install
      - name: 🔧 Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"

          pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install undetected-chromedriver beautifulsoup4 lxml requests

          echo "✅ All Python packages installed"

      # Step 5 — Display setup
      - name: 🖥️ Setup Virtual Display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2
          echo "✅ Virtual display ready"

      # Step 6 — Scraper chalao
      - name: 🤖 Run Price Scraper
        run: python auto_updater.py
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ":99"
        timeout-minutes: 35

      # Step 7 — JSON verify karo
      - name: ✅ Verify Output
        run: |
          if [ -f "grocery_data.json" ]; then
            echo "✅ grocery_data.json exists"
            echo "Size: $(wc -c < grocery_data.json) bytes"
            echo "Products: $(python -c "import json; d=json.load(open('grocery_data.json')); print(d.get('total_products', 0))")"
          else
            echo "❌ grocery_data.json NOT found!"
            exit 1
          fi

      # Step 8 — Updated JSON push karo
      - name: 📤 Push Updated Data to Repo
        run: |
          git config --global user.name "BestPrice Bot"
          git config --global user.email "bot@bestprice.app"
          git config --global commit.gpgsign false

          git add grocery_data.json

          git diff --staged --quiet \
            && echo "No changes to commit — prices same hain" \
            || git commit -m "🔄 Price Update — $(date -u '+%d %b %Y %H:%M UTC') [skip ci]"

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
